name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build Application
        run: mvn clean install

      - name: Print Java Version
        run: java -version

      - name: Print Maven Version
        run: mvn -version

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Verify Trivy
        run: trivy --version

      - name: Trivy Secret Scan
        run: |
          trivy fs --scanners secret .

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.24.2

          wget https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

          tar -xzf gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz

          sudo mv gitleaks /usr/local/bin/

      - name: Verify Gitleaks
        run: |
          gitleaks version

      - name: Gitleaks Scan
        run: |
          gitleaks detect --source .

      # Uncomment after SonarQube is ready
      # - name: SonarQube Scan
      #   run: |
      #     mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
      #       -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
      #       -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Verify JAR
        run: |
          ls -ltr target

      - name: Build Docker Image
        run: |
          docker build -t springboot-app .

      - name: Verify Docker Image
        run: |
          docker images

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag Docker Image
        run: |
          docker tag springboot-app:latest 026852303988.dkr.ecr.us-east-1.amazonaws.com/springboot-app:latest

      - name: Push Docker Image
        run: |
          docker push 026852303988.dkr.ecr.us-east-1.amazonaws.com/springboot-app:latest

      - name: Deploy To EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 026852303988.dkr.ecr.us-east-1.amazonaws.com

            docker pull 026852303988.dkr.ecr.us-east-1.amazonaws.com/springboot-app:latest

            docker stop springboot-app || true
            docker rm springboot-app || true

            docker run -d \
              --name springboot-app \
              -p 8080:8080 \
              026852303988.dkr.ecr.us-east-1.amazonaws.com/springboot-app:latest