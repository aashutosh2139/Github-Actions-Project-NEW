name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  cicd:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build
        run: mvn clean install

      - name: Print Java Version
        run: java -version

      - name: Print Maven Version
        run: mvn -version

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg

          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | \
          gpg --dearmor | \
          sudo tee /usr/share/keyrings/trivy.gpg > /dev/null

          echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] https://aquasecurity.github.io/trivy-repo/deb generic main" | \
          sudo tee /etc/apt/sources.list.d/trivy.list

          sudo apt-get update
          sudo apt-get install -y trivy

      - name: Verify Trivy
        run: trivy --version

      - name: Trivy Secret Scan
        run: |
          trivy fs --scanners secret .
        
      - name: Install Gitleaks
        run: |
          curl -sSfL \
          https://raw.githubusercontent.com/gitleaks/gitleaks/master/install.sh | \
          sudo sh -s -- -b /usr/local/bin

#      - name: SonarQube Scan
#        run: |
#          mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
#           -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
#           -Dsonar.token=${{ secrets.SONAR_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t springboot-app .

      - name: Verify Docker Image
        run: |
          docker images

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credential@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Tag Docker Image
        run: |
          docker tag springboot-app:latest 123456789012.dkr.ecr.us-east-1.amazonaws.com/springboot-app:latest

      - name: Push Docker Image
        run: |
          docker push 123456789012.dkr.ecr.us-east-1.amazonaws.com/springboot-app:latest
